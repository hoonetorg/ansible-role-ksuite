---
# Merged with the inventory variable `ksuite` into `ksuite_final`.
ksuite_defaults:
  # Infomaniak desktop apps installed on this host for all users (always the version Infomaniak publishes as
  # latest); apps not listed are removed again. Known: kdrive, kchat, kmeet (vars/main.yml)
  apps: []
  # AppImages; fixed file names without version: the autostart entries the apps write per user
  # (~/.config/autostart) point here, so they stay valid across updates
  dir: /opt/ksuite
  # fusermount for the AppImage runtime (libfuse is built in)
  packages: [fuse]
