---
- name: Build final ksuite configuration
  ansible.builtin.set_fact:
    ksuite_final: "{{ ksuite_defaults | combine(ksuite | default({}), recursive=True) }}"

- name: Assert ksuite apps (known apps)
  ansible.builtin.assert:
    that: ksuite_final.apps | difference(ksuite_catalog.keys()) | length == 0
    fail_msg: "ksuite: apps must be out of {{ ksuite_catalog.keys() | join(', ') }}, not {{ ksuite_final.apps | join(', ') }}"
    quiet: true

- name: Install ksuite apps
  when: ksuite_final.apps | length > 0
  block:
    - name: Only openSUSE on x86_64 is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Suse'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: >-
          ksuite: only openSUSE on x86_64 is implemented (the apps are x86_64 AppImages), not
          {{ ansible_facts['distribution'] }} on {{ ansible_facts['architecture'] }}
        quiet: true

    - name: Install packages for the AppImages
      ansible.builtin.package:
        name: "{{ ksuite_final.packages }}"
        state: present

    - name: ksuite directory
      ansible.builtin.file:
        path: "{{ ksuite_final.dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

# every known app: installed when listed in apps, removed otherwise (desired state)
- name: ksuite app
  ansible.builtin.include_tasks: app.yml
  loop: "{{ ksuite_catalog.keys() | list }}"
  loop_control:
    loop_var: ksuite_app_id
  vars:
    ksuite_app: "{{ ksuite_catalog[ksuite_app_id] }}"
    ksuite_appimage: "{{ ksuite_final.dir }}/{{ ksuite_catalog[ksuite_app_id].name }}.AppImage"
